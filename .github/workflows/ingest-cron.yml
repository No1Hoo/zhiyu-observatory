name: Ingestion Cron

on:
  schedule:
    - cron: "15 22 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsx scripts/call-cron-ingest.ts
        env:
          ZHIYU_INGEST_URL: ${{ secrets.ZHIYU_INGEST_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
